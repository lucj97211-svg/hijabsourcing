                "name": "What is your minimum order per colour?",

                  "@type": "Answer",
                  "text": "It depends on the base fabric and whether the shade is from our stock range or a custom lab dip. Stock shades start considerably lower than custom ones. Send the fabric and shade you have in mind and we will quote the exact minimum rather than a marketing number."

                "@type": "Question",
                "name": "What does GSM actually change?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "GSM is grams per square metre — the fabric's weight. Lower weights are lighter and more sheer with a fluid fall; higher weights are more opaque, warmer and hold their shape. Every base fabric in our range runs across a band rather than a single fixed weight, so you choose where in that band your product sits."
